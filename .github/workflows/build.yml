name: Build and Publish Rust Python Extension

on:
  push:
    tags:
      - 'v*'   # 例如 v0.1.0、v1.2.3 等

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Build manylinux 2.17 wheel in Docker
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          docker run --rm \
            -e PYTHON_VERSION="$PYTHON_VERSION" \
            -v "$GITHUB_WORKSPACE:/io" \
            -w /io \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -euxo pipefail -c '
              yum install -y openssl-devel pkgconfig gcc curl;
              curl https://sh.rustup.rs -sSf | sh -s -- -y;
              source "$HOME/.cargo/env";
              PYTHON_TAG="cp${PYTHON_VERSION/./}-cp${PYTHON_VERSION/./}";
              PYTHON_DIR="";
              for dir in /opt/python/${PYTHON_TAG}*; do
                if [[ -d "$dir" ]]; then PYTHON_DIR="$dir"; break; fi;
              done;
              if [[ -z "$PYTHON_DIR" ]]; then
                echo "No interpreter found: /opt/python/${PYTHON_TAG}*";
                ls -1 /opt/python;
                exit 1;
              fi;
              PYTHON_BIN="${PYTHON_DIR}/bin";
              "${PYTHON_BIN}/pip" install --upgrade pip;
              "${PYTHON_BIN}/pip" install maturin==1.9.2;
              "${PYTHON_BIN}/maturin" build --release --manylinux 2_17 --interpreter "${PYTHON_BIN}/python";
            '
      - name: Upload Linux wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-py${{ matrix.python-version }}
          path: target/wheels/*.whl

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Add macOS targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin and delocate
        run: pip install maturin delocate

      - name: Build x86_64 wheel
        run: |
          mkdir -p target/wheels/x86_64
          maturin build --release --target x86_64-apple-darwin --interpreter python${{ matrix.python-version }}
          mv target/wheels/*.whl target/wheels/x86_64/

      - name: Build aarch64 wheel
        run: |
          mkdir -p target/wheels/aarch64
          maturin build --release --target aarch64-apple-darwin --interpreter python${{ matrix.python-version }}
          mv target/wheels/*.whl target/wheels/aarch64/

      - name: Create universal2 wheel
        run: |
          pip install delocate
          mkdir -p target/wheels/universal
          delocate-merge \
            -w target/wheels/universal \
            target/wheels/x86_64/*.whl \
            target/wheels/aarch64/*.whl
          mv target/wheels/universal/*.whl target/wheels/

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-py${{ matrix.python-version }}
          path: target/wheels/*.whl

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install maturin
        run: python -m pip install maturin==1.9.2
      - name: Build wheel and repack ZIP
        shell: pwsh
        run: |
          python -m maturin build --release --interpreter python
          Get-ChildItem "target\wheels\*.whl" | ForEach-Object {
            Write-Host "Repack ZIP: $($_.FullName)"
            $tempDir = "temp_repack"
            if (Test-Path $tempDir) { Remove-Item -Recurse -Force $tempDir }
            Expand-Archive -Path $_.FullName -DestinationPath $tempDir -Force
            Remove-Item -Force $_.FullName
            Compress-Archive -Path "$tempDir\*" -DestinationPath $_.FullName -CompressionLevel Optimal
            Remove-Item -Recurse -Force $tempDir
          }
      - name: Verify wheel ZIP
        shell: pwsh
        run: |
          Get-ChildItem "target\wheels\*.whl" | ForEach-Object {
            python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); assert bad is None, bad" $_.FullName
            Write-Host "ZIP ok: $($_.Name)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-py${{ matrix.python-version }}
          path: target/wheels/*.whl

  publish:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Show GitHub context (for debugging)
        run: |
          echo "REF: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "ACTOR: ${{ github.actor }}"
          echo "EVENT_NAME: ${{ github.event_name }}"
          echo "WORKSPACE: ${{ github.workspace }}"
          echo "REPOSITORY: ${{ github.repository }}"

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*

      - name: Show downloaded artifacts
        run: |
          echo "=== dist 目录结构 ==="
          find dist -type f -name "*.whl" -exec ls -lh {} \;

      - name: Collect one clean wheel per filename
        run: |
          mkdir -p final_dist
          find dist -type f -name "*.whl" | sort | while read -r wheel; do
            base=$(basename "$wheel")
            if [ -e "final_dist/$base" ]; then
              echo "skip duplicate $base from $wheel"
              continue
            fi
            python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); bad=z.testzip(); assert bad is None, bad" "$wheel"
            cp "$wheel" "final_dist/$base"
          done
          echo "=== final_dist 内容 ==="
          ls -lh final_dist
          test "$(find final_dist -name '*.whl' | wc -l)" -eq 3

      - name: Check wheels with twine
        run: |
          pip install twine
          twine check final_dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip_existing: true
          verbose: true
          packages_dir: final_dist
